name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug build
        run: gradle --no-daemon :app:assembleDebug

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFEPOINTS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIFEPOINTS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing LifePoints signing secrets. See README.md."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFEPOINTS_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifepoints-release.jks"

      - name: Build signed release APK
        env:
          LIFEPOINTS_KEYSTORE_PATH: ${{ runner.temp }}/lifepoints-release.jks
          LIFEPOINTS_KEYSTORE_PASSWORD: ${{ secrets.LIFEPOINTS_KEYSTORE_PASSWORD }}
          LIFEPOINTS_KEY_PASSWORD: ${{ secrets.LIFEPOINTS_KEY_PASSWORD }}
          LIFEPOINTS_KEY_ALIAS: lifepoints
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk LifePoints.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifePoints-release-${{ github.run_number }}
          path: LifePoints.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          gh release create "$TAG" LifePoints.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LifePoints ${VERSION}" \
            --generate-notes
