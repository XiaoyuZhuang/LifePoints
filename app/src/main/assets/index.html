<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>LifePoints</title><style>
:root{--bg:#f4f6f5;--s:#fff;--s2:#f7f8f8;--t:#121716;--m:#7c8683;--l:#e7ebe9;--g:#0aa664;--gd:#078b54;--gs:#eaf8f1;--r:#d84b4b}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--s);color:var(--t)}button,input{font:inherit}.app{min-height:100vh;background:var(--s)}.content{padding:18px 16px 92px}.page{display:none}.page.on{display:block}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h1{font-size:29px;line-height:1;margin:0;font-weight:800;letter-spacing:-.7px}.add{border:0;background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.summary{background:var(--gs);border-radius:15px;padding:11px 14px;margin:8px 0 12px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.summary.one{grid-template-columns:1fr}.metric+.metric{border-left:1px solid #bfe6d2;padding-left:14px}.ml{font-size:12px;color:#236f50;font-weight:700}.mv{display:flex;align-items:baseline;gap:6px;color:var(--gd);font-size:29px;font-weight:850}.mv.small{font-size:24px}.lp{background:var(--g);color:#fff;border-radius:999px;font-size:11px;padding:4px 7px}.list{display:flex;flex-direction:column;gap:6px}.row{min-height:48px;border:1px solid var(--l);border-radius:14px;display:grid;align-items:center;gap:9px;padding:6px 10px;background:var(--s)}.task{grid-template-columns:30px minmax(0,1fr) auto auto auto}.reward{grid-template-columns:30px minmax(0,1fr) auto auto}.timeline{grid-template-columns:46px 28px minmax(0,1fr) auto}.ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--gs);font-size:16px}.name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mul{border:0;min-width:41px;padding:6px 9px;border-radius:999px;background:var(--gs);color:var(--gd);font-size:12px;font-weight:850}.pts,.more{border:0;background:transparent}.pts{min-width:48px;text-align:right;color:var(--gd);font-size:15px;font-weight:850}.pts.spend{color:var(--r)}.more{width:22px;color:#8a9491;font-size:20px}.tsum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--gs);border-radius:15px;padding:10px 8px;margin:8px 0 12px}.tm{text-align:center}.tm+.tm{border-left:1px solid #bfe6d2}.tl{font-size:11px;color:#39705a}.tv{font-size:22px;font-weight:850}.pos{color:var(--gd)}.neg{color:var(--r)}.time{font-size:12px;color:var(--m)}.amt{font-size:15px;font-weight:850}.section{margin-top:16px}.st{font-size:17px;font-weight:800;margin-bottom:7px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme{padding:12px 10px;border-radius:13px;border:1px solid var(--l);background:var(--s);color:var(--t);font-weight:750}.theme.sel{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.theme.black{background:#000;color:#fff;border-color:#000}.card{border:1px solid var(--l);border-radius:15px;overflow:hidden}.sr{min-height:48px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--l)}.sr:last-child{border-bottom:0}.si{width:24px;text-align:center}.sl{flex:1;font-size:14px;font-weight:650}.sv{font-size:12px;color:var(--m)}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px 12px;border-top:1px solid var(--l)}.mi{width:100%;padding:9px;border:1px solid var(--l);border-radius:10px;text-align:center;background:var(--s2);color:var(--t);font-weight:800}.sw{width:46px;height:27px;border-radius:99px;background:#cfd6d3;position:relative}.sw:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 4px #0003}.sw.on{background:var(--g)}.sw.on:after{left:22px}.nav{position:fixed;left:0;right:0;bottom:0;height:78px;padding:8px 6px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:var(--s);border-top:1px solid var(--l)}.nb{border:0;background:transparent;color:#87918e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}.nb b{font-size:19px}.nb.on{color:var(--gd)}.back{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;padding:16px;z-index:9}.back.on{display:flex}.modal{width:100%;background:var(--s);border-radius:22px;padding:18px}.modal h2{margin:0 0 14px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:var(--s2);color:var(--t)}.ma{display:flex;justify-content:flex-end;gap:8px}.cancel,.save{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.cancel{background:var(--s2);color:var(--t)}.save{background:var(--g);color:#fff}body.black{--bg:#000;--s:#000;--s2:#0b0b0b;--t:#f7f7f7;--m:#8d9491;--l:#202522;--gs:#071b12}body.black .nav{background:#000}
</style></head><body><main class="app"><section class="content">
<div class="page on" id="tasks"><div class="top"><h1>My tasks</h1><button class="add" data-add="task">＋ Add</button></div><div class="summary"><div class="metric"><div class="ml">Balance</div><div class="mv"><span id="tb">1,240</span><span class="lp">LP</span></div></div><div class="metric"><div class="ml">Total earned</div><div class="mv small" id="te">3,860</div></div></div><div class="list" id="taskList"></div></div>
<div class="page" id="rewards"><div class="top"><h1>My rewards</h1><button class="add" data-add="reward">＋ Add</button></div><div class="summary one"><div class="metric"><div class="ml">Balance</div><div class="mv"><span id="rb">1,240</span><span class="lp">LP</span></div></div></div><div class="list" id="rewardList"></div></div>
<div class="page" id="timeline"><div class="top"><h1>Timeline</h1></div><div class="tsum"><div class="tm"><div class="tl">Gained</div><div class="tv pos" id="gain">+0</div></div><div class="tm"><div class="tl">Spent</div><div class="tv neg" id="spent">−0</div></div><div class="tm"><div class="tl">Net</div><div class="tv pos" id="net">+0</div></div></div><div class="list" id="timeList"></div></div>
<div class="page" id="settings"><div class="top"><h1>Settings</h1></div><div class="section"><div class="st">Theme</div><div class="themes"><button class="theme sel" data-theme="light">☀︎ Light</button><button class="theme black" data-theme="black">☾ Pure Black</button></div></div><div class="section"><div class="st">Points</div><div class="card"><div class="sr"><div class="si">×</div><div class="sl">Custom multipliers</div></div><div class="inputs"><input class="mi" id="m1" type="number" min=".1" step=".1"><input class="mi" id="m2" type="number" min=".1" step=".1"><input class="mi" id="m3" type="number" min=".1" step=".1"></div><div class="sr"><div class="si">✓</div><div class="sl">Confirm before spending points</div><div class="sw on" id="confirm"></div></div><div class="sr"><div class="si">◉</div><div class="sl">Haptics</div><div class="sw on" id="haptics"></div></div></div></div><div class="section"><div class="st">App</div><div class="card"><div class="sr" id="support"><div class="si">♥</div><div class="sl">Support me</div><div>›</div></div><div class="sr" id="about"><div class="si">ⓘ</div><div class="sl">About LifePoints</div><div>›</div></div><div class="sr" id="export"><div class="si">⇩</div><div class="sl">Export data</div><div>›</div></div></div></div></div>
</section><nav class="nav"><button class="nb on" data-page="tasks"><b>☑</b>Tasks</button><button class="nb" data-page="rewards"><b>🎁</b>Rewards</button><button class="nb" data-page="timeline"><b>▥</b>Timeline</button><button class="nb" data-page="settings"><b>⚙</b>Settings</button></nav></main>
<div class="back" id="back"><div class="modal"><h2 id="mt">Add</h2><div class="field"><label>Name</label><input id="iname"></div><div class="field"><label>Points</label><input id="ipoints" type="number" min="1"></div><div class="ma"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save</button></div></div></div>
<script>
const SUPPORT='https://github.com/XiaoyuZhuang/LifePoints';const seed={balance:1240,totalEarned:3860,multipliers:[1,2,3],theme:'light',confirmSpend:true,haptics:true,tasks:[{id:1,icon:'📚',name:'Study',base:20,m:1},{id:2,icon:'🏃',name:'Exercise',base:30,m:0},{id:3,icon:'💼',name:'Work',base:25,m:1},{id:4,icon:'💧',name:'Health',base:5,m:0},{id:5,icon:'☀️',name:'Personal',base:10,m:0},{id:6,icon:'📖',name:'Read',base:10,m:1},{id:7,icon:'❤️',name:'Mindfulness',base:15,m:0}],rewards:[{id:1,icon:'🍿',name:'Watch an episode',cost:80},{id:2,icon:'🎬',name:'Watch a movie',cost:250},{id:3,icon:'☕',name:'Favorite snack',cost:80},{id:4,icon:'🛍️',name:'Buy something nice',cost:500},{id:5,icon:'🎮',name:'30 min gaming',cost:100}],timeline:[{id:1,time:'09:10',icon:'📚',text:'Study',amount:40},{id:2,time:'10:30',icon:'🏃',text:'Exercise',amount:30},{id:3,time:'12:40',icon:'🍿',text:'Watch an episode',amount:-20},{id:4,time:'14:00',icon:'💼',text:'Work',amount:50},{id:5,time:'18:20',icon:'☕',text:'Favorite snack',amount:-80},{id:6,time:'21:00',icon:'📖',text:'Read',amount:20},{id:7,time:'22:10',icon:'🎮',text:'Gaming',amount:-30}]};let state;try{state={...seed,...JSON.parse(localStorage.getItem('lifepoints-state'))}}catch(e){state=structuredClone(seed)}if(!state.tasks)state=structuredClone(seed);let mode='task';const $=x=>document.getElementById(x),fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:1}),now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}),save=()=>localStorage.setItem('lifepoints-state',JSON.stringify(state));function tap(){if(state.haptics&&navigator.vibrate)navigator.vibrate(12)}
function tasks(){taskList.innerHTML='';state.tasks.forEach(t=>{let m=Number(state.multipliers[t.m]??1),a=Math.round(t.base*m*10)/10,r=document.createElement('div');r.className='row task';r.innerHTML=`<div class="ico">${t.icon}</div><div class="name">${t.name}</div><button class="mul">${fmt(m)}×</button><button class="pts">+${fmt(a)}</button><button class="more">⋮</button>`;r.children[2].onclick=()=>{t.m=(t.m+1)%state.multipliers.length;tap();save();render()};r.children[3].onclick=()=>{let x=Math.round(t.base*Number(state.multipliers[t.m])*10)/10;state.balance+=x;state.totalEarned+=x;state.timeline.unshift({id:Date.now(),time:now(),icon:t.icon,text:t.name,amount:x});tap();save();render()};r.children[4].onclick=()=>{if(confirm(`Delete "${t.name}"?`)){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}};taskList.appendChild(r)})}
function rewards(){rewardList.innerHTML='';state.rewards.forEach(x=>{let r=document.createElement('div');r.className='row reward';r.innerHTML=`<div class="ico">${x.icon}</div><div class="name">${x.name}</div><button class="pts spend">−${fmt(x.cost)}</button><button class="more">⋮</button>`;r.children[2].onclick=()=>{if(state.balance<x.cost)return alert('Not enough points.');if(state.confirmSpend&&!confirm(`Spend ${x.cost} points on "${x.name}"?`))return;state.balance-=x.cost;state.timeline.unshift({id:Date.now(),time:now(),icon:x.icon,text:x.name,amount:-x.cost});tap();save();render()};r.children[3].onclick=()=>{if(confirm(`Delete "${x.name}"?`)){state.rewards=state.rewards.filter(y=>y.id!==x.id);save();render()}};rewardList.appendChild(r)})}
function history(){timeList.innerHTML='';state.timeline.forEach(x=>{let r=document.createElement('div');r.className='row timeline';r.innerHTML=`<div class="time">${x.time}</div><div class="ico">${x.icon}</div><div class="name">${x.text}</div><div class="amt ${x.amount>=0?'pos':'neg'}">${x.amount>=0?'+':'−'}${fmt(Math.abs(x.amount))}</div>`;timeList.appendChild(r)});let g=state.timeline.filter(x=>x.amount>0).reduce((a,b)=>a+b.amount,0),s=Math.abs(state.timeline.filter(x=>x.amount<0).reduce((a,b)=>a+b.amount,0)),n=g-s;gain.textContent='+'+fmt(g);spent.textContent='−'+fmt(s);net.textContent=(n>=0?'+':'−')+fmt(Math.abs(n));net.className='tv '+(n>=0?'pos':'neg')}
function settings(){document.body.classList.toggle('black',state.theme==='black');document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('sel',b.dataset.theme===state.theme));confirm.classList.toggle('on',state.confirmSpend);haptics.classList.toggle('on',state.haptics);state.multipliers.forEach((v,i)=>{let e=$('m'+(i+1));if(document.activeElement!==e)e.value=v});if(window.LifePointsAndroid?.setTheme)window.LifePointsAndroid.setTheme(state.theme)}function render(){$('tb').textContent=fmt(state.balance);$('rb').textContent=fmt(state.balance);$('te').textContent=fmt(state.totalEarned);tasks();rewards();history();settings()}document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nb').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.page).classList.add('on');tap()});document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();settings()});$('confirm').onclick=()=>{state.confirmSpend=!state.confirmSpend;save();settings()};$('haptics').onclick=()=>{state.haptics=!state.haptics;save();settings()};[1,2,3].forEach((n,i)=>$('m'+n).onchange=e=>{state.multipliers[i]=Math.max(.1,Number(e.target.value)||1);save();render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{mode=b.dataset.add;$('mt').textContent=mode==='task'?'Add task':'Add reward';$('iname').value='';$('ipoints').value='';back.classList.add('on')});$('cancel').onclick=()=>back.classList.remove('on');back.onclick=e=>{if(e.target===back)back.classList.remove('on')};$('save').onclick=()=>{let name=$('iname').value.trim(),p=Math.max(1,Number($('ipoints').value)||0);if(!name||!p)return;if(mode==='task')state.tasks.push({id:Date.now(),icon:'✓',name,base:p,m:0});else state.rewards.push({id:Date.now(),icon:'★',name,cost:p});back.classList.remove('on');save();render()};$('support').onclick=()=>location.href=SUPPORT;$('about').onclick=()=>alert('LifePoints\nDo things. Earn points. Spend them on rewards.');$('export').onclick=()=>{let j=JSON.stringify(state,null,2);if(window.LifePointsAndroid?.exportData)return window.LifePointsAndroid.exportData(j);let u=URL.createObjectURL(new Blob([j],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='lifepoints-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
