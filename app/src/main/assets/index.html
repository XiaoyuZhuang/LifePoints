<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LifePoints</title>
<style>
:root{--bg:#f4f6f5;--s:#fff;--s2:#f7f8f8;--t:#121716;--m:#7c8683;--l:#e7ebe9;--g:#0aa664;--gd:#078b54;--gs:#eaf8f1;--r:#d84b4b;--rs:#fff1f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--s);color:var(--t)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--s)}.content{padding:18px 16px 92px}.page{display:none}.page.on{display:block}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h1{font-size:29px;line-height:1;margin:0;font-weight:800;letter-spacing:-.7px}.add{border:0;background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.summary{background:var(--gs);border-radius:15px;padding:11px 14px;margin:8px 0 12px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.summary.one{grid-template-columns:1fr}.metric+.metric{border-left:1px solid #bfe6d2;padding-left:14px}.ml{font-size:12px;color:#236f50;font-weight:700}.mv{display:flex;align-items:baseline;gap:6px;color:var(--gd);font-size:29px;font-weight:850}.mv.small{font-size:24px}.lp{background:var(--g);color:#fff;border-radius:999px;font-size:11px;padding:4px 7px}.list{display:flex;flex-direction:column;gap:6px}.row{min-height:48px;border:1px solid var(--l);border-radius:14px;display:grid;align-items:center;gap:9px;padding:6px 10px;background:var(--s)}.task{grid-template-columns:30px minmax(0,1fr) auto auto auto}.reward{grid-template-columns:30px minmax(0,1fr) auto auto}.timeline{grid-template-columns:46px 28px minmax(0,1fr) auto}.ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--gs);font-size:16px}.name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mul{border:0;min-width:41px;padding:6px 9px;border-radius:999px;background:var(--gs);color:var(--gd);font-size:12px;font-weight:850}.pts,.more{border:0;background:transparent}.pts{min-width:48px;text-align:right;color:var(--gd);font-size:15px;font-weight:850}.pts.spend{color:var(--r)}.more{width:22px;color:#8a9491;font-size:20px}.tsum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--gs);border-radius:15px;padding:10px 8px;margin:8px 0 12px}.tm{text-align:center}.tm+.tm{border-left:1px solid #bfe6d2}.tl{font-size:11px;color:#39705a}.tv{font-size:22px;font-weight:850}.pos{color:var(--gd)}.neg{color:var(--r)}.time{font-size:12px;color:var(--m)}.amt{font-size:15px;font-weight:850}.section{margin-top:16px}.st{font-size:17px;font-weight:800;margin-bottom:7px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme{padding:12px 10px;border-radius:13px;border:1px solid var(--l);background:var(--s);color:var(--t);font-weight:750}.theme.sel{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.theme.black{background:#000;color:#fff;border-color:#000}.card{border:1px solid var(--l);border-radius:15px;overflow:hidden;background:var(--s)}.sr{min-height:48px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--l)}.sr:last-child{border-bottom:0}.sr.tap{cursor:pointer}.si{width:24px;text-align:center}.sl{flex:1;font-size:14px;font-weight:650}.sv{font-size:12px;color:var(--m)}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px 12px;border-top:1px solid var(--l)}.mi{width:100%;padding:9px;border:1px solid var(--l);border-radius:10px;text-align:center;background:var(--s2);color:var(--t);font-weight:800;outline:none}.mi:focus{border-color:var(--g)}.sw{width:46px;height:27px;border-radius:99px;background:#cfd6d3;position:relative;pointer-events:none;transition:.15s}.sw:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 4px #0003}.sw.on{background:var(--g)}.sw.on:after{left:22px}.danger .si,.danger .sl{color:var(--r)}.nav{position:fixed;left:0;right:0;bottom:0;height:78px;padding:8px 6px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:var(--s);border-top:1px solid var(--l);z-index:6}.nb{border:0;background:transparent;color:#87918e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}.nb b{font-size:19px}.nb.on{color:var(--gd)}.back{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;padding:16px;z-index:20}.back.on{display:flex}.modal{width:100%;background:var(--s);border:1px solid var(--l);border-radius:22px;padding:18px;box-shadow:0 18px 55px #0003}.modal h2{margin:0 0 8px;font-size:21px}.modal p{margin:0 0 16px;color:var(--m);font-size:14px;line-height:1.45}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:var(--s2);color:var(--t);outline:none}.field input:focus{border-color:var(--g)}.ma{display:flex;justify-content:flex-end;gap:8px}.cancel,.save,.dangerBtn{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.cancel{background:var(--s2);color:var(--t)}.save{background:var(--g);color:#fff}.dangerBtn{background:var(--r);color:#fff}body.black{--bg:#000;--s:#000;--s2:#0b0b0b;--t:#f7f7f7;--m:#8d9491;--l:#202522;--gs:#071b12;--rs:#180808}body.black .nav{background:#000}body.black .summary,body.black .tsum{background:#071b12}body.black .metric+.metric,body.black .tm+.tm{border-color:#164c34}body.black .modal{box-shadow:0 18px 55px #000}
@media(min-width:700px){.content{max-width:520px;margin:auto}.nav{left:50%;width:520px;transform:translateX(-50%)}}
</style>
</head>
<body>
<main class="app"><section class="content">
<div class="page on" id="tasks"><div class="top"><h1>My tasks</h1><button class="add" data-add="task">＋ Add</button></div><div class="summary"><div class="metric"><div class="ml">Balance</div><div class="mv"><span id="tb">1,240</span><span class="lp">LP</span></div></div><div class="metric"><div class="ml">Total earned</div><div class="mv small" id="te">3,860</div></div></div><div class="list" id="taskList"></div></div>
<div class="page" id="rewards"><div class="top"><h1>My rewards</h1><button class="add" data-add="reward">＋ Add</button></div><div class="summary one"><div class="metric"><div class="ml">Balance</div><div class="mv"><span id="rb">1,240</span><span class="lp">LP</span></div></div></div><div class="list" id="rewardList"></div></div>
<div class="page" id="timeline"><div class="top"><h1>Timeline</h1></div><div class="tsum"><div class="tm"><div class="tl">Gained</div><div class="tv pos" id="gain">+0</div></div><div class="tm"><div class="tl">Spent</div><div class="tv neg" id="spent">−0</div></div><div class="tm"><div class="tl">Net</div><div class="tv pos" id="net">+0</div></div></div><div class="list" id="timeList"></div></div>
<div class="page" id="settings"><div class="top"><h1>Settings</h1></div><div class="section"><div class="st">Theme</div><div class="themes"><button class="theme sel" data-theme="light">☀︎ Light</button><button class="theme black" data-theme="black">☾ Pure Black</button></div></div><div class="section"><div class="st">Points</div><div class="card"><div class="sr"><div class="si">×</div><div class="sl">Custom multipliers</div></div><div class="inputs"><input class="mi" id="m1" type="number" min=".1" step=".1" inputmode="decimal" aria-label="Multiplier 1"><input class="mi" id="m2" type="number" min=".1" step=".1" inputmode="decimal" aria-label="Multiplier 2"><input class="mi" id="m3" type="number" min=".1" step=".1" inputmode="decimal" aria-label="Multiplier 3"></div><div class="sr tap" id="confirmRow"><div class="si">✓</div><div class="sl">Confirm before spending points</div><div class="sw on" id="confirm"></div></div><div class="sr tap" id="hapticsRow"><div class="si">◉</div><div class="sl">Haptics</div><div class="sw on" id="haptics"></div></div></div></div><div class="section"><div class="st">App</div><div class="card"><div class="sr tap" id="support"><div class="si">♥</div><div class="sl">Support me</div><div>›</div></div><div class="sr tap" id="about"><div class="si">ⓘ</div><div class="sl">About LifePoints</div><div>›</div></div><div class="sr tap" id="export"><div class="si">⇩</div><div class="sl">Export data</div><div>›</div></div><div class="sr tap danger" id="clearAll"><div class="si">⌫</div><div class="sl">Clear all data</div><div>›</div></div></div></div></div>
</section><nav class="nav"><button class="nb on" data-page="tasks"><b>☑</b>Tasks</button><button class="nb" data-page="rewards"><b>🎁</b>Rewards</button><button class="nb" data-page="timeline"><b>▥</b>Timeline</button><button class="nb" data-page="settings"><b>⚙</b>Settings</button></nav></main>
<div class="back" id="addBack"><div class="modal"><h2 id="addTitle">Add</h2><div class="field"><label>Name</label><input id="iname" autocomplete="off"></div><div class="field"><label>Points</label><input id="ipoints" type="number" min="1" inputmode="decimal"></div><div class="ma"><button class="cancel" id="addCancel">Cancel</button><button class="save" id="addSave">Save</button></div></div></div>
<div class="back" id="dialogBack"><div class="modal"><h2 id="dialogTitle">LifePoints</h2><p id="dialogMessage"></p><div class="ma"><button class="cancel" id="dialogCancel">Cancel</button><button class="save" id="dialogConfirm">OK</button></div></div></div>
<script>
const SUPPORT='https://github.com/XiaoyuZhuang/LifePoints';
const demoState={balance:1240,totalEarned:3860,multipliers:[1,2,3],theme:'light',confirmSpend:true,haptics:true,tasks:[{id:1,icon:'📚',name:'Study',base:20,m:1},{id:2,icon:'🏃',name:'Exercise',base:30,m:0},{id:3,icon:'💼',name:'Work',base:25,m:1},{id:4,icon:'💧',name:'Health',base:5,m:0},{id:5,icon:'☀️',name:'Personal',base:10,m:0},{id:6,icon:'📖',name:'Read',base:10,m:1},{id:7,icon:'❤️',name:'Mindfulness',base:15,m:0}],rewards:[{id:1,icon:'🍿',name:'Watch an episode',cost:80},{id:2,icon:'🎬',name:'Watch a movie',cost:250},{id:3,icon:'☕',name:'Favorite snack',cost:80},{id:4,icon:'🛍️',name:'Buy something nice',cost:500},{id:5,icon:'🎮',name:'30 min gaming',cost:100}],timeline:[{id:1,time:'09:10',icon:'📚',text:'Study',amount:40},{id:2,time:'10:30',icon:'🏃',text:'Exercise',amount:30},{id:3,time:'12:40',icon:'🍿',text:'Watch an episode',amount:-20},{id:4,time:'14:00',icon:'💼',text:'Work',amount:50},{id:5,time:'18:20',icon:'☕',text:'Favorite snack',amount:-80},{id:6,time:'21:00',icon:'📖',text:'Read',amount:20},{id:7,time:'22:10',icon:'🎮',text:'Gaming',amount:-30}]};
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:1}),now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});let mode='task',dialogResolve=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function loadState(){try{const saved=JSON.parse(localStorage.getItem('lifepoints-state'));if(!saved)return clone(demoState);return {...clone(demoState),...saved,multipliers:Array.isArray(saved.multipliers)&&saved.multipliers.length?saved.multipliers:[1,2,3],tasks:Array.isArray(saved.tasks)?saved.tasks:[],rewards:Array.isArray(saved.rewards)?saved.rewards:[],timeline:Array.isArray(saved.timeline)?saved.timeline:[]}}catch(e){return clone(demoState)}}let state=loadState();
function save(){localStorage.setItem('lifepoints-state',JSON.stringify(state))}function nativeTheme(){try{window.LifePointsAndroid?.setTheme(state.theme)}catch(e){}}function rawHaptic(kind='tap'){try{if(window.LifePointsAndroid?.haptic){window.LifePointsAndroid.haptic(kind);return}}catch(e){}if(navigator.vibrate)navigator.vibrate(kind==='success'?25:12)}function haptic(kind='tap'){if(state.haptics)rawHaptic(kind)}
function showDialog({title='LifePoints',message='',confirmText='OK',cancelText='',danger=false}){$('dialogTitle').textContent=title;$('dialogMessage').textContent=message;$('dialogConfirm').textContent=confirmText;$('dialogConfirm').className=danger?'dangerBtn':'save';$('dialogCancel').textContent=cancelText||'Cancel';$('dialogCancel').style.display=cancelText?'inline-block':'none';$('dialogBack').classList.add('on');return new Promise(resolve=>{dialogResolve=resolve})}function closeDialog(value){$('dialogBack').classList.remove('on');const resolve=dialogResolve;dialogResolve=null;if(resolve)resolve(value)}$('dialogConfirm').onclick=()=>{haptic();closeDialog(true)};$('dialogCancel').onclick=()=>{haptic();closeDialog(false)};$('dialogBack').onclick=e=>{if(e.target===$('dialogBack')&&$('dialogCancel').style.display!=='none')closeDialog(false)};const showInfo=(title,message)=>showDialog({title,message,confirmText:'OK'}),ask=(title,message,confirmText='Confirm',danger=false)=>showDialog({title,message,confirmText,cancelText:'Cancel',danger});
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTasks(){$('taskList').innerHTML='';state.tasks.forEach(t=>{const mult=Number(state.multipliers[t.m]??1),amount=Math.round(t.base*mult*10)/10,row=document.createElement('div');row.className='row task';row.innerHTML=`<div class="ico">${t.icon}</div><div class="name">${esc(t.name)}</div><button class="mul">${fmt(mult)}×</button><button class="pts">+${fmt(amount)}</button><button class="more">⋮</button>`;row.children[2].onclick=()=>{t.m=(t.m+1)%state.multipliers.length;haptic();save();render()};row.children[3].onclick=()=>{const x=Math.round(t.base*Number(state.multipliers[t.m])*10)/10;state.balance+=x;state.totalEarned+=x;state.timeline.unshift({id:Date.now(),time:now(),icon:t.icon,text:t.name,amount:x});haptic('success');save();render()};row.children[4].onclick=async()=>{if(await ask('Delete task?',`Delete "${t.name}" from your task list?`,'Delete',true)){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}};$('taskList').appendChild(row)})}
function renderRewards(){$('rewardList').innerHTML='';state.rewards.forEach(x=>{const row=document.createElement('div');row.className='row reward';row.innerHTML=`<div class="ico">${x.icon}</div><div class="name">${esc(x.name)}</div><button class="pts spend">−${fmt(x.cost)}</button><button class="more">⋮</button>`;row.children[2].onclick=async()=>{if(state.balance<x.cost){haptic();await showInfo('Not enough points',`You need ${fmt(x.cost)} points for "${x.name}".`);return}if(state.confirmSpend&&!await ask('Spend points?',`Spend ${fmt(x.cost)} points on "${x.name}"?`,'Spend'))return;state.balance-=x.cost;state.timeline.unshift({id:Date.now(),time:now(),icon:x.icon,text:x.name,amount:-x.cost});haptic('success');save();render()};row.children[3].onclick=async()=>{if(await ask('Delete reward?',`Delete "${x.name}" from your rewards?`,'Delete',true)){state.rewards=state.rewards.filter(y=>y.id!==x.id);save();render()}};$('rewardList').appendChild(row)})}
function renderHistory(){$('timeList').innerHTML='';state.timeline.forEach(x=>{const row=document.createElement('div');row.className='row timeline';row.innerHTML=`<div class="time">${esc(x.time)}</div><div class="ico">${x.icon}</div><div class="name">${esc(x.text)}</div><div class="amt ${x.amount>=0?'pos':'neg'}">${x.amount>=0?'+':'−'}${fmt(Math.abs(x.amount))}</div>`;$('timeList').appendChild(row)});const gained=state.timeline.filter(x=>x.amount>0).reduce((a,b)=>a+b.amount,0),spent=Math.abs(state.timeline.filter(x=>x.amount<0).reduce((a,b)=>a+b.amount,0)),n=gained-spent;$('gain').textContent='+'+fmt(gained);$('spent').textContent='−'+fmt(spent);$('net').textContent=(n>=0?'+':'−')+fmt(Math.abs(n));$('net').className='tv '+(n>=0?'pos':'neg')}
function renderSettings(){document.body.classList.toggle('black',state.theme==='black');document.querySelector('meta[name="theme-color"]').content=state.theme==='black'?'#000000':'#ffffff';document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('sel',b.dataset.theme===state.theme));$('confirm').classList.toggle('on',!!state.confirmSpend);$('haptics').classList.toggle('on',!!state.haptics);state.multipliers.forEach((v,i)=>{const e=$('m'+(i+1));if(document.activeElement!==e)e.value=v});nativeTheme()}function render(){$('tb').textContent=fmt(state.balance);$('rb').textContent=fmt(state.balance);$('te').textContent=fmt(state.totalEarned);renderTasks();renderRewards();renderHistory();renderSettings()}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nb').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.page).classList.add('on');window.scrollTo({top:0,behavior:'instant'});haptic()});document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme==='black'?'black':'light';save();renderSettings();haptic()});$('confirmRow').onclick=()=>{state.confirmSpend=!state.confirmSpend;save();renderSettings();haptic()};$('hapticsRow').onclick=()=>{state.haptics=!state.haptics;save();renderSettings();if(state.haptics)rawHaptic('success')};[0,1,2].forEach(i=>$('m'+(i+1)).addEventListener('change',e=>{const v=Math.max(.1,Number(e.target.value)||1);state.multipliers[i]=Math.round(v*10)/10;save();render();haptic()}));
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{mode=b.dataset.add;$('addTitle').textContent=mode==='task'?'Add task':'Add reward';$('iname').value='';$('ipoints').value='';$('addBack').classList.add('on');setTimeout(()=>$('iname').focus(),80);haptic()});$('addCancel').onclick=()=>{$('addBack').classList.remove('on');haptic()};$('addBack').onclick=e=>{if(e.target===$('addBack'))$('addBack').classList.remove('on')};$('addSave').onclick=()=>{const name=$('iname').value.trim(),points=Math.max(1,Number($('ipoints').value)||0);if(!name||!points)return;if(mode==='task')state.tasks.push({id:Date.now(),icon:'✓',name,base:points,m:0});else state.rewards.push({id:Date.now(),icon:'★',name,cost:points});$('addBack').classList.remove('on');save();render();haptic('success')};
$('support').onclick=()=>{haptic();location.href=SUPPORT};$('about').onclick=async()=>{haptic();await showInfo('About LifePoints','Do things. Earn points. Spend them on rewards.')};$('export').onclick=()=>{haptic();try{if(window.LifePointsAndroid?.exportData)window.LifePointsAndroid.exportData(JSON.stringify(state,null,2));else{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lifepoints-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}catch(e){}};$('clearAll').onclick=async()=>{haptic();const ok=await ask('Clear all data?','Tasks, rewards, balance, total earned, and timeline will be permanently cleared. Theme, multipliers, and app preferences will be kept.','Clear all',true);if(!ok)return;const prefs={theme:state.theme,multipliers:[...state.multipliers],confirmSpend:state.confirmSpend,haptics:state.haptics};state={balance:0,totalEarned:0,tasks:[],rewards:[],timeline:[],...prefs};save();render();haptic('success')};window.LifePointsBack=()=>{if($('dialogBack').classList.contains('on')){closeDialog(false);return true}if($('addBack').classList.contains('on')){$('addBack').classList.remove('on');return true}return false};render();
</script></body></html>
